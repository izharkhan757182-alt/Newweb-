
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Enhancer — ToolSphere</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet">
<style>body{font-family:Geist,sans-serif} .slider{ -webkit-appearance:none; appearance:none; height:100%; width:3px; background:white; }</style>
</head>
<body class="bg-[#0A0A0B] text-zinc-100 min-h-screen">
  <header class="h-[56px] border-b border-white/[0.06] flex items-center px-6 justify-between">
    <a href="/" class="flex items-center gap-2"><div class="w-7 h-7 bg-white text-black grid place-items-center rounded-md font-bold text-xs">TS</div><span class="text-sm font-semibold">ToolSphere</span><span class="text-[11px] text-zinc-500 ml-2">/ enhancer</span></a>
    <a href="/generator.html" class="text-xs px-3 py-1.5 rounded-full bg-white/[0.08] border border-white/[0.08] hover:bg-white/[0.12]">Generator →</a>
  </header>

  <main class="max-w-[1120px] mx-auto px-6 py-10 grid lg:grid-cols-[380px_1fr] gap-8">
    <div class="space-y-5">
      <div>
        <h1 class="text-[28px] font-semibold tracking-tight leading-none">Image Enhancer</h1>
        <p class="text-[13px] text-zinc-500 mt-2">4x upscale + face restore. ESRGAN primary, GFPGAN fallback.</p>
      </div>

      <div id="drop" class="rounded-2xl border border-dashed border-white/[0.14] bg-[#121213] p-6 text-center cursor-pointer hover:border-white/25 transition">
        <input id="fileInput" type="file" accept="image/*" class="hidden"/>
        <div class="w-10 h-10 mx-auto rounded-xl bg-white text-black grid place-items-center mb-3">↑</div>
        <p class="text-[13px] font-medium">Drop image or click to upload</p>
        <p class="text-[11px] text-zinc-500 mt-1">PNG, JPG up to 8MB. Auto converts to base64 → HF</p>
        <img id="previewThumb" class="hidden mt-4 w-full h-32 object-cover rounded-xl border border-white/[0.06]"/>
      </div>

      <div class="rounded-2xl border border-white/[0.08] bg-[#121213] p-5 space-y-4">
        <div class="flex items-center justify-between">
          <label class="text-[11px] tracking-widest text-zinc-400 uppercase">Mode</label>
          <span class="text-[10px] px-2 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/20">FREE • NO KEY NEEDED FRONTEND</span>
        </div>
        <select id="mode" class="w-full rounded-xl bg-[#0A0A0B] border border-white/[0.08] p-2.5 text-[13px] outline-none">
          <option value="upscale">Upscale 4x — General</option>
          <option value="face">Face Restore — GFPGAN/CodeFormer</option>
          <option value="both">Both — Upscale + Face</option>
        </select>

        <button id="enhanceBtn" disabled class="w-full h-11 rounded-xl bg-white text-black text-[13px] font-semibold disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2">
          <span id="enhanceText">Enhance Image</span>
          <svg id="enhSpinner" class="hidden animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="3" opacity="0.2"/><path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        </button>
        <div id="status" class="text-[11px] text-zinc-500 min-h-[16px]"></div>
      </div>
    </div>

    <!-- Before/After -->
    <div class="rounded-[20px] border border-white/[0.08] bg-[#121213] p-3 min-h-[520px] flex flex-col">
      <div class="flex items-center justify-between px-2 py-2">
        <span class="text-[11px] tracking-widest text-zinc-500 uppercase">Before / After</span>
        <div class="flex gap-2">
          <button id="dlBtn" class="hidden text-[11px] px-3 py-1.5 rounded-full bg-white text-black font-medium">Download Enhanced</button>
          <input id="range" type="range" min="0" max="100" value="50" class="w-24 accent-white"/>
        </div>
      </div>

      <div id="compareWrap" class="relative flex-1 rounded-xl overflow-hidden bg-[#0A0A0B] border border-white/[0.06] grid place-items-center">
        <div id="empty" class="text-center p-10">
          <div class="w-12 h-12 mx-auto rounded-full bg-white/[0.06] grid place-items-center mb-3">◐</div>
          <p class="text-[13px] text-zinc-400">Upload an image to start</p>
        </div>

        <!-- Compare layers -->
        <div id="compare" class="hidden absolute inset-0">
          <img id="beforeImg" class="absolute inset-0 w-full h-full object-contain bg-black"/>
          <div id="afterClip" class="absolute inset-0 overflow-hidden" style="clip-path: inset(0 50% 0 0)">
            <img id="afterImg" class="w-full h-full object-contain bg-black"/>
          </div>
          <div id="divider" class="absolute top-0 bottom-0 w-[2px] bg-white" style="left:50%">
            <div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-7 h-7 rounded-full bg-white text-black grid place-items-center text-[11px] font-bold">↔</div>
          </div>
        </div>
      </div>
    </div>
  </main>

<script>
const $ = s=>document.querySelector(s);
const drop=$('#drop'), fileInput=$('#fileInput'), thumb=$('#previewThumb');
const enhanceBtn=$('#enhanceBtn'), enhanceText=$('#enhanceText'), spinner=$('#enhSpinner'), statusEl=$('#status');
const beforeImg=$('#beforeImg'), afterImg=$('#afterImg'), afterClip=$('#afterClip'), divider=$('#divider'), range=$('#range');
const compare=$('#compare'), empty=$('#empty'), compareWrap=$('#compareWrap'), dlBtn=$('#dlBtn');

let originalBase64=null, originalDataUrl=null;

function setOriginal(file){
  const reader=new FileReader();
  reader.onload=()=>{ 
    originalDataUrl=reader.result; 
    originalBase64=reader.result.split(',')[1];
    thumb.src=originalDataUrl; thumb.classList.remove('hidden');
    beforeImg.src=originalDataUrl;
    empty.classList.add('hidden'); compare.classList.remove('hidden');
    enhanceBtn.disabled=false;
    statusEl.textContent='Ready • '+file.name+' • '+(file.size/1024/1024).toFixed(2)+' MB';
  };
  reader.readAsDataURL(file);
}

drop.addEventListener('click',()=>fileInput.click());
drop.addEventListener('dragover', e=>{ e.preventDefault(); drop.classList.add('border-white/30'); });
drop.addEventListener('dragleave', ()=>drop.classList.remove('border-white/30'));
drop.addEventListener('drop', e=>{ e.preventDefault(); drop.classList.remove('border-white/30'); const f=e.dataTransfer.files[0]; if(f) setOriginal(f); });
fileInput.addEventListener('change', e=>{ const f=e.target.files[0]; if(f) setOriginal(f); });

range.addEventListener('input', e=>{
  const v=e.target.value;
  afterClip.style.clipPath='inset(0 '+(100-v)+'% 0 0)';
  divider.style.left=v+'%';
});

async function enhance(){
  if(!originalBase64) return;
  enhanceBtn.disabled=true; enhanceText.textContent='Enhancing...'; spinner.classList.remove('hidden');
  statusEl.textContent='Calling /api/enhance • mode: '+$('#mode').value+'...';
  try{
    const res=await fetch('/api/enhance',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ imageBase64: originalBase64, mode: $('#mode').value })
    });
    const data=await res.json();
    if(!res.ok) throw new Error(data.error || 'Enhance failed');
    const src='data:image/png;base64,'+data.image;
    afterImg.src=src;
    statusEl.textContent='Done • model: '+(data.model||'unknown')+(data.fallback?' (fallback)':'');
    dlBtn.classList.remove('hidden');
    dlBtn.onclick=()=>{ const a=document.createElement('a'); a.href=src; a.download='enhanced-'+Date.now()+'.png'; a.click(); };
  }catch(e){ statusEl.textContent='Error: '+e.message; }
  finally{ enhanceBtn.disabled=false; enhanceText.textContent='Enhance Image'; spinner.classList.add('hidden'); }
}
enhanceBtn.addEventListener('click', enhance);
</script>
</body>
</html>
